<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Cheia Estoque - Consulta</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="marca">
            <img src="img/logo.svg" alt="Logo do Mercado Cesta Cheia" width="45" height="45">
            <span>Cesta Cheia <small>Estoque</small></span>
        </div>
        <nav>
            <ul>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="estoque.html" class="ativo">Estoque</a></li>
                <li><a href="gerenciar.html">Gerenciar</a></li>
                <li><a href="index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Consulta de Estoque</h1>

        <section class="cartao">
            <form id="formPesquisa" class="filtros" role="search">
                <div class="campo">
                    <label for="pesquisa">Pesquisar produto</label>
                    <input type="search" id="pesquisa" name="pesquisa" placeholder="Nome, código ou situação">
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria">
                        <option value="">Todas</option>
                        <option value="Hortifruti">Hortifruti</option>
                        <option value="Mercearia">Mercearia</option>
                        <option value="Laticínios">Laticínios</option>
                        <option value="Padaria">Padaria</option>
                    </select>
                </div>
            </form>

            <p id="resultado" class="resultado" aria-live="polite"></p>

            <div class="tabela-container">
                <table id="tabelaEstoque">
                    <caption>Produtos cadastrados no estoque</caption>
                    <thead>
                        <tr>
                            <th scope="col">Imagem</th>
                            <th scope="col">Código</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col">Preço</th>
                            <th scope="col">Situação</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mercado Cesta Cheia - Sistema interno</p>
        <p>Desenvolvido por Pedro Henrique de Sousa Martins - DSM</p>
    </footer>

    <script src="js/produtos.js"></script>
    <script src="js/estoque.js"></script>
</body>
</html>
