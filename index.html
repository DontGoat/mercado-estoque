<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Cheia Estoque - Login</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

    <main class="login-container">
        <form id="formLogin" class="cartao login" novalidate>
            <img src="img/logo.svg" alt="Logo do Mercado Cesta Cheia" class="login-logo" width="90" height="90">
            <h1>Cesta Cheia</h1>
            <p class="subtitulo">Sistema de Estoque</p>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@cestacheia.com" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

            <p id="mensagem" class="mensagem" aria-live="polite"></p>

            <button type="submit">Entrar</button>

            <div class="acesso-teste">
                <p><strong>Acesso de teste</strong></p>
                <p>E-mail: pedro@cestacheia.com</p>
                <p>Senha: 123456</p>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mercado Cesta Cheia - Sistema interno</p>
        <p>Desenvolvido por Pedro Henrique de Sousa Martins - DSM</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
